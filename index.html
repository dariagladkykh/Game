add(7,'choice','Фінал · редактор','Обери правильно оформлене запитання.',{options:['як тебе звати.','Як тебе звати?','Як тебе звати'],answer:1},'Потрібні велика літера на початку та знак питання в кінці.','Як тебе звати? Усі випробування пройдено — книга відновлена!','notebook');
const KEY='literka-book-adventure-v1';
const fresh=()=>({version:1,records:{},score:0,streak:0,bonuses:0,pages:[],seen:[],prolog:false,finished:false,sound:false,creative:'',surname:'',firstName:'',word:'мрія',selfChecked:false,last:0});
let state=fresh();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&s.records&&Array.isArray(s.pages)){state={...fresh(),...s};}}catch{}
let screen='home',current=0,mem={},lastFocus=null,soundContext=null,toastTimer=null;
const app=document.getElementById('app');
function record(t){return state.records[t.id]||(state.records[t.id]={done:false,attempts:0,mistakes:0,hints:0,part:0,pairs:[],bonus:0});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function hydrate(root=document){root.querySelectorAll('[data-art]').forEach(el=>{el.src=ASSETS[el.dataset.art];});}
function updateHeader(){document.getElementById('starStat').textContent='★ '+state.score;document.getElementById('pageStat').textContent='Сторінки '+state.pages.length+' / 7';const n=Object.values(state.records).filter(r=>r.done).length;document.getElementById('progressBar').style.width=n/tasks.length*100+'%';document.querySelector('.bar').setAttribute('aria-valuenow',n);const b=document.getElementById('soundButton');b.textContent=state.sound?'Звук: увімк.':'Звук: вимк.';b.setAttribute('aria-pressed',state.sound);}
function paint(html,bg='background'){app.innerHTML=html;document.body.style.setProperty('--scene',`url("${ASSETS[bg]}")`);updateHeader();window.scrollTo({top:0,behavior:'instant'});}
function sayToast(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3500);}
function sound(good=true){if(!state.sound)return;try{soundContext=soundContext||new(window.AudioContext||window.webkitAudioContext)();soundContext.resume();const now=soundContext.currentTime;[0,.12,.24].forEach((off,i)=>{const o=soundContext.createOscillator(),g=soundContext.createGain();o.connect(g);g.connect(soundContext.destination);o.type='sine';o.frequency.value=good?[523,659,784][i]:[330,294,330][i];g.gain.setValueAtTime(0,now+off);g.gain.linearRampToValueAtTime(.07,now+off+.015);g.gain.exponentialRampToValueAtTime(.001,now+off+.2);o.start(now+off);o.stop(now+off+.21);});}catch{}}
function toggleSound(){state.sound=!state.sound;save();updateHeader();if(state.sound)sound();}
function celebrate(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=document.getElementById('confetti');el.innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#efbd59','#268a76','#eb9278','#f8df9f'][i%4]};animation-delay:${Math.random()*.5}s"></i>`).join('');setTimeout(()=>el.innerHTML='',3400);}
function goHome(){screen='home';const started=state.prolog||Object.keys(state.records).length>0;paint(`<div class="hero"><section class="hero-copy"><div class="eyebrow">Ілюстрований квест</div><h1>Таємниця<br><em>загубленої</em><br>книги</h1><p>Сторінки Книги українського слова розлетілися крізь час. Допоможи друзям повернути їх до чарівної бібліотеки!</p><div class="pill-row"><span class="pill">7 локацій</span><span class="pill">20–30 хвилин</span><span class="pill">Без поспіху</span></div><div class="actions"><button class="primary" onclick="startAdventure()">${state.finished?'До відновленої книги':started?'Продовжити пригоду':'Почати пригоду'} →</button>${started?'<button class="ghost small" onclick="confirmRestart()">Нова гра</button>':''}</div><p class="tiny muted" style="margin:19px 0 0">Натискай на відповіді, збирай сторінки та користуйся підказками Літерки.</p></section><div class="hero-art" aria-label="Твої друзі в пригоді">${art('boy','boy')}${art('girl','girl')}${art('owl','owl')}${art('book','book')}<span class="name-tag tag-boy">Сергійко</span><span class="name-tag tag-girl">Оленка</span><span class="name-tag tag-owl">Літерка</span></div></div>`);}
function startAdventure(){if(state.finished)return showFinish();if(!state.prolog)return openTask(0);showMap();}
function unlocked(ch){return ch===0?state.prolog:ch===7?state.pages.length===7:state.pages.includes(ch-1);}
function chapterTasks(ch){return tasks.filter(t=>t.ch===ch);}
function pageIcons(){return `<div class="pages" aria-label="Зібрано ${state.pages.length} із семи сторінок">${chapters.map((c,i)=>art('page',state.pages.includes(i)?'found':'',`${state.pages.includes(i)?'Зібрана':'Ще не знайдена'} сторінка ${i+1}`)).join('')}</div>`;}
function showMap(){if(!state.prolog)return openTask(0);screen='map';paint(`<section class="panel"><div class="screen-heading"><div><div class="eyebrow">Маршрут крізь час</div><h2>Сім сторінок — одна книга</h2></div><button class="ghost small" onclick="goHome()">До бібліотеки</button></div><p class="map-intro muted">Відкривай локації по черзі. Кожна пригода поверне одну сторінку. Пройдені завдання можна переглядати.</p><div class="map-grid">${chapters.map((c,i)=>`<button class="location ${state.pages.includes(i)?'done':unlocked(i)?'available':''}" onclick="openChapter(${i})" ${!unlocked(i)?'disabled':''}><span class="index">${i+1}</span>${art(c.art)}<strong>${c.short}</strong><small>${state.pages.includes(i)?'✓ Сторінку знайдено':unlocked(i)?'Вирушити в пригоду →':'Відкрий попередню локацію'}</small></button>`).join('')}<button class="location ${state.finished?'done':unlocked(7)?'available':''}" onclick="openChapter(7)" ${unlocked(7)?'':'disabled'}><span class="index">★</span>${art('book')}<strong>Відновлення книги</strong><small>${state.finished?'✓ Книга відновлена':unlocked(7)?'Фінальний квест →':'Збери всі сім сторінок'}</small></button></div><div class="map-guide">${art('owl')}<p><strong>Літерка:</strong> «Помилки допомагають учитися. Я поруч — підкажу, поясню й підтримаю!»</p>${art('boy')}${art('girl')}</div>${pageIcons()}</section>`,'library');}
function guide(ch){const c=chapters[ch];return `<aside class="guide">${art('owl','guide-owl')}<div class="guide-name">Сова Літерка</div><p class="speech" id="speech">${esc(c?c.speech:ch===7?'Сім сторінок уже з нами! Пройди п’ять останніх випробувань.':'Привіт! Я Літерка. Разом із Сергійком та Оленкою ми врятуємо чарівну книгу.')}</p><button class="small gold" onclick="hint()">✦ Підказка Літерки</button><div class="companions"><figure class="${c?.friend==='boy'?'active':''}">${art('boy')}<figcaption>Сергійко</figcaption></figure><figure class="${c?.friend==='girl'?'active':''}">${art('girl')}<figcaption>Оленка</figcaption></figure></div></aside>`;}
function openChapter(ch){if(!unlocked(ch))return;if(ch===7&&state.finished)return showFinish();if(ch===7){screen='intro';paint(`<div class="quest-layout"><section class="panel quest-panel"><div class="eyebrow">Фінальна пригода</div><h2>Повернімо книгу до життя!</h2><div class="learn">${art('book','learn-art')}<p>Ми зібрали сім сторінок. Тепер перевіримо, які таємниці ти запам’ятав. П’ять відповідей — і чарівна книга знову засяє!</p></div>${pageIcons()}<div class="actions"><button class="primary" onclick="beginChapter(7)">Почати фінальний квест →</button></div></section>${guide(7)}</div>`);return;}screen='intro';current=tasks.indexOf(chapterTasks(ch)[0]);const c=chapters[ch];paint(`<div class="quest-layout"><section class="panel quest-panel"><div class="eyebrow">Локація ${ch+1} / 7 · Знайомство</div><h2>${c.title}</h2><div class="learn">${art(c.art,'learn-art')}<p>${c.learn}</p></div><div class="fact">${c.fact}</div><div class="learn-thumbs">${c.gallery.map(k=>`<figure>${art(k)}<figcaption>${ALT[k]}</figcaption></figure>`).join('')}</div><div class="actions"><button class="primary" onclick="beginChapter(${ch})">${state.pages.includes(ch)?'Переглянути завдання':'До випробувань'} →</button><button class="ghost" onclick="showMap()">Мапа</button></div></section>${guide(ch)}</div>`);}
function beginChapter(ch){if(!state.seen.includes(ch))state.seen.push(ch);save();const list=chapterTasks(ch),next=list.find(t=>!record(t).done)||list[0];openTask(tasks.indexOf(next));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shuffledIndices(n){const a=shuffle(Array.from({length:n},(_,i)=>i));if(n>1&&a.every((v,i)=>v===i)){a.push(a.shift());}return a;}
function newMem(t){return {left:null,picked:[],selected:[],order:shuffledIndices(t.type==='words'?t.data.words[record(t).part||0]?.length||1:t.data.items?.length||t.data.right?.length||1),edits:(t.data.lines||[]).map(l=>({upper:false,end:''}))};}
function openTask(i){const t=tasks[i];if(!t||t.ch>=0&&!unlocked(t.ch))return;current=i;state.last=i;screen='task';mem=newMem(t);save();renderTask();}
function renderTask(){const t=tasks[current],r=record(t),list=chapterTasks(t.ch),pos=list.indexOf(t);paint(`<div class="quest-layout"><section class="panel quest-panel"><div class="quest-meta"><span>${t.ch<0?'ПРОЛОГ · ЧАРІВНА БІБЛІОТЕКА':t.ch===7?'ФІНАЛЬНИЙ КВЕСТ':`ЛОКАЦІЯ ${t.ch+1} / 7`}</span><div class="dots" aria-label="Завдання ${pos+1} з ${list.length}">${list.map((tt,j)=>`<span class="dot ${record(tt).done||j===pos?'on':''}"></span>`).join('')}</div></div><h2 tabindex="-1" id="taskHeading">${t.title}</h2><p class="instruction">${t.instruction}</p><div id="exercise">${r.done?completedMarkup(t):exerciseMarkup(t)}</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions" id="taskActions">${r.done?nextButton(t):''}${t.ch>=0?`<button class="ghost small" onclick="openChapter(${t.ch})">Пригадати матеріал</button>`:''}</div></section>${guide(t.ch)}</div>`);}
function optionMarkup(opt){return typeof opt==='string'?esc(opt):`${opt.img?art(opt.img):''}<span>${esc(opt.label)}</span>`;}
function choiceButtons(options,handler,picture=false){return `<div class="choice-grid ${options.some(o=>typeof o==='string'&&o.length>28)?'single':''}">${options.map((o,i)=>`<button class="choice ${picture?'picture':''}" onclick="${handler}(${i})">${optionMarkup(o)}</button>`).join('')}</div>`;}
function exerciseMarkup(t){const r=record(t),d=t.data;let head=t.img?art(t.img,'exercise-art'):'';
if(t.type==='choice')return head+choiceButtons(d.options,'choose',typeof d.options[0]==='object');
if(t.type==='multi')return head+`<div class="choice-grid">${d.options.map((v,i)=>`<button class="choice ${mem.selected.includes(i)?'selected':''}" aria-pressed="${mem.selected.includes(i)}" onclick="toggleMulti(${i})">${esc(v)}</button>`).join('')}</div><div class="actions"><button class="primary" onclick="checkMulti()">Перевірити промінчики</button></div>`;
if(t.type==='match'){const paired=r.pairs||[];return `<div class="match"><div class="match-col">${d.left.map((v,i)=>`<button class="choice ${paired.includes(i)?'matched':mem.left===i?'selected':''}" aria-pressed="${mem.left===i}" ${paired.includes(i)?'disabled':''} onclick="selectLeft(${i})">${optionMarkup(v)}${paired.includes(i)?' ✓':''}</button>`).join('')}</div><div class="match-col">${mem.order.map(i=>`<button class="choice ${paired.includes(i)?'matched':''}" ${paired.includes(i)?'disabled':''} onclick="selectRight(${i})">${esc(d.right[i])}${paired.includes(i)?' ✓':''}</button>`).join('')}</div></div>`;}
if(t.type==='sort'){const it=d.items[r.part];return `<p class="subprogress">Предмет ${r.part+1} із ${d.items.length}</p><div class="sort-item">${art(it.img)}<strong>${it.label}</strong></div><div class="sort-bins">${d.bins.map((b,i)=>`<button onclick="sortTo(${i})">${b.img?art(b.img):''}${esc(b.label)}</button>`).join('')}</div>`;}
if(t.type==='words'){const word=d.words[r.part],pool=Array.from(word);return head+`<p class="subprogress">Слово ${r.part+1} із ${d.words.length}</p><div class="fact">${d.clues[r.part]}</div><div class="answer-tray">${mem.picked.length?mem.picked.map((i,p)=>`<button class="tile" aria-label="Повернути літеру ${pool[i]}" onclick="unpick(${p})">${pool[i]}</button>`).join(''):'<span class="placeholder">Тут з’явиться слово</span>'}</div><div class="tray">${mem.order.map(i=>`<button class="tile" ${mem.picked.includes(i)?'disabled':''} onclick="pick(${i})">${pool[i]}</button>`).join('')}</div><div class="actions"><button class="primary" onclick="checkOrder()" ${mem.picked.length!==pool.length?'disabled':''}>Перевірити слово</button><button class="ghost small" onclick="resetPicked()">Зібрати заново</button></div>`;}
if(t.type==='order'){return head+`<div class="answer-tray ${d.sentence?'':'sequence-picked'}">${mem.picked.length?mem.picked.map((i,p)=>`<button class="${d.sentence?'tile word':''}" onclick="unpick(${p})">${d.sentence?'':`<b>${p+1}.</b>`}${optionMarkup(d.items[i])}</button>`).join(''):'<span class="placeholder">Натискай на картки внизу</span>'}</div><div class="${d.sentence?'tray':'order-tray'}">${mem.order.map(i=>`<button class="tile ${d.sentence?'word':''}" ${mem.picked.includes(i)?'disabled':''} onclick="pick(${i})">${optionMarkup(d.items[i])}</button>`).join('')}</div><div class="actions"><button class="primary" onclick="checkOrder()" ${mem.picked.length!==d.items.length?'disabled':''}>Перевірити порядок</button><button class="ghost small" onclick="resetPicked()">Зібрати заново</button></div>`;}
if(t.type==='rounds'||t.type==='code'){let code=t.type==='code'?`<div class="code" aria-label="Відкриті цифри коду">${d.digits.map((v,i)=>`<span>${i<r.part?v:'?'}</span>`).join('')}</div>`:'';if(t.type==='code'&&r.part===d.rounds.length)return head+code+'<div class="actions" style="justify-content:center"><button class="gold" onclick="unlockArchive()">Відімкнути скриньку</button></div>';const q=d.rounds[r.part];return head+code+`<p class="subprogress">${t.type==='code'?'Цифра коду':'Крок'} ${r.part+1} із ${d.rounds.length}</p><h3>${esc(q.q)}</h3>`+choiceButtons(q.options,'chooseRound');}
if(t.type==='edit')return head+`<div class="editor">${d.lines.map((l,i)=>`<div><button onclick="toggleCapital(${i})" aria-label="Змінити першу літеру на ${mem.edits[i].upper?'малу':'велику'}">${mem.edits[i].upper?l.first.toUpperCase():l.first}</button>${esc(l.rest)}<button onclick="cycleMark(${i})" aria-label="Змінити знак у кінці речення ${i+1}">${mem.edits[i].end||'…'}</button></div>`).join('')}</div><p class="tiny muted">Натискання змінює літеру або знак: … → . → ? → !</p><div class="actions"><button class="primary" onclick="checkEdit()">Перевірити рукопис</button></div>`;
return '';}
function refreshExercise(){document.getElementById('exercise').innerHTML=exerciseMarkup(tasks[current]);}
function feedback(text,bad=false){const el=document.getElementById('feedback');el.textContent=text;el.className='feedback'+(bad?' bad':'');document.getElementById('speech').textContent=bad?'Спробуй ще раз. Помилятися — це теж учитися!':'Чудова робота! Рухаймося далі.';}
function attempt(ok,success){const t=tasks[current],r=record(t);if(r.done)return;r.attempts++;if(!ok){r.mistakes++;state.streak=0;save();feedback('Спробуй ще раз. '+t.hint,true);sound(false);return;}success();save();updateHeader();}
function choose(i){const t=tasks[current];attempt(i===t.data.answer,()=>complete(t));}
function selectLeft(i){if(record(tasks[current]).done)return;mem.left=i;refreshExercise();}
function selectRight(i){const t=tasks[current],r=record(t);if(r.done||r.pairs.includes(i))return;if(mem.left===null){feedback('Спочатку обери картку ліворуч.',true);return;}attempt(mem.left===i,()=>{r.pairs.push(i);mem.left=null;if(r.pairs.length===t.data.left.length)complete(t);else{refreshExercise();feedback('Пару знайдено! Знайди наступну.');sound();}});}
function sortTo(i){const t=tasks[current],r=record(t);attempt(i===t.data.items[r.part].bin,()=>{r.part++;if(r.part===t.data.items.length)complete(t);else{refreshExercise();feedback('Правильно! А куди покладемо наступний предмет?');sound();}});}
function pick(i){if(record(tasks[current]).done||mem.picked.includes(i))return;mem.picked.push(i);refreshExercise();}
function unpick(p){mem.picked.splice(p,1);refreshExercise();}
function resetPicked(){mem.picked=[];refreshExercise();}
function checkOrder(){const t=tasks[current],r=record(t);const ok=t.type==='words'?mem.picked.map(i=>t.data.words[r.part][i]).join('')===t.data.words[r.part]:mem.picked.length===t.data.items.length&&mem.picked.every((v,i)=>v===i);attempt(ok,()=>{if(t.type==='words'&&r.part<t.data.words.length-1){r.part++;mem=newMem(t);refreshExercise();feedback('Слово складено! Розгадай наступне.');sound();}else complete(t);});}
function toggleMulti(i){if(record(tasks[current]).done)return;mem.selected=mem.selected.includes(i)?mem.selected.filter(v=>v!==i):[...mem.selected,i];refreshExercise();}
function checkMulti(){const t=tasks[current];attempt(mem.selected.length===t.data.answers.length&&t.data.answers.every(v=>mem.selected.includes(v)),()=>complete(t));}
function chooseRound(i){const t=tasks[current],r=record(t);if(r.done||r.part>=t.data.rounds.length)return;attempt(i===t.data.rounds[r.part].answer,()=>{r.part++;if(r.part===t.data.rounds.length&&t.type!=='code')complete(t);else{refreshExercise();feedback(t.type==='code'?'Правильно! Цифра коду відкрита.':'Правильно! Прочитай наступне речення.');sound();}});}
function unlockArchive(){const t=tasks[current],r=record(t);if(t.type==='code'&&r.part===3&&!r.done)complete(t);}
function toggleCapital(i){mem.edits[i].upper=!mem.edits[i].upper;refreshExercise();}
function cycleMark(i){const a=['','.','?','!'];mem.edits[i].end=a[(a.indexOf(mem.edits[i].end)+1)%a.length];refreshExercise();}
function checkEdit(){const t=tasks[current];attempt(mem.edits.every((e,i)=>e.upper&&e.end===t.data.lines[i].end),()=>complete(t));}
function completedMarkup(t){const r=record(t);return `<div style="text-align:center">${art(t.ch===7?'book':'page','exercise-art')}<h3>✓ Завдання виконано</h3><p>${t.why}</p><p class="pill" style="display:inline-block">+10 зірочок${r.bonus?' · +5 за серію':''}</p>${t.type==='code'?`<div class="code">${t.data.digits.map(n=>`<span>${n}</span>`).join('')}</div>`:''}</div>`;}
function nextButton(t){const last=chapterTasks(t.ch).at(-1)===t;return `<button class="primary" onclick="nextTask()">${t.ch<0?'Відкрити мапу':last?(t.ch===7?'Відновити книгу':'Забрати сторінку'):'Наступне завдання'} →</button>`;}
function complete(t){const r=record(t);if(r.done)return;r.done=true;state.score+=10;if(r.mistakes===0){state.streak++;if(state.streak%3===0){state.score+=5;state.bonuses++;r.bonus=5;}}else state.streak=0;if(t.ch===-1)state.prolog=true;if(t.ch>=0&&t.ch<7&&chapterTasks(t.ch).every(x=>record(x).done)&&!state.pages.includes(t.ch)){state.pages.push(t.ch);state.pages.sort();}if(t.ch===7&&chapterTasks(7).every(x=>record(x).done))state.finished=true;save();document.getElementById('exercise').innerHTML=completedMarkup(t);document.getElementById('taskActions').innerHTML=nextButton(t)+(t.ch>=0?`<button class="ghost small" onclick="openChapter(${t.ch})">Пригадати матеріал</button>`:'');feedback(r.bonus?'Три завдання поспіль без помилок! Ще 5 зірочок за уважність.':'Літерка: «Молодець! Ця таємниця вже тобі відома».');updateHeader();sound();}
function nextTask(){const t=tasks[current];if(!record(t).done)return;if(t.ch<0)return showMap();if(chapterTasks(t.ch).at(-1)===t)return t.ch===7?showFinish():showReward(t.ch);openTask(current+1);}
function showReward(ch){screen='reward';const c=chapters[ch];paint(`<section class="panel reward"><div class="eyebrow">Локацію пройдено!</div>${art('page','page-art')}<h2>Сторінка ${ch+1} повернулася!</h2><h3>«${c.page}»</h3><p>Літерка, Сергійко та Оленка дякують тобі.<br>${state.pages.length===7?'Усі сім сторінок знайдено. Час відновити книгу!':`У книзі вже ${state.pages.length} із 7 сторінок. Пригода триває!`}</p>${pageIcons()}<div class="finish-heroes">${art('boy')}${art('owl','owl')}${art('girl')}</div><div class="actions"><button class="primary" onclick="openChapter(${ch+1})">${ch===6?'До фінального квесту':'До наступної локації'} →</button><button class="ghost" onclick="showMap()">Мапа пригоди</button></div></section>`);celebrate();}
function hint(){if(screen==='task'){const t=tasks[current],r=record(t);if(!r.done){r.hints++;save();}document.getElementById('speech').textContent=t.hint;feedback('Літерка підказує: '+t.hint);}else{const el=document.getElementById('speech');if(el)el.textContent='Спочатку прочитай коротку розповідь. Під час завдань я дам конкретну підказку — без втрати зірочок.';}}
function showFinish(){if(!state.finished)return showMap();screen='finish';const done=Object.values(state.records).filter(r=>r.done),first=done.filter(r=>r.mistakes===0).length;paint(`<section class="panel finish"><div class="finish-top">${art('medal')}<div><div class="eyebrow">Пригоду завершено!</div><h2>Ти — охоронець<br>українського слова!</h2><p>Книга відновлена. Літерка, Сергійко та Оленка вітають тебе!</p><div class="pill-row"><span class="pill">★ ${state.score} зірочок</span><span class="pill">7 / 7 сторінок</span><span class="pill">${first} / ${tasks.length} без помилок</span></div></div></div><div class="finish-heroes">${art('boy')}${art('book')}${art('owl','owl')}${art('girl')}</div><div class="creative"><h3>Твій диплом охоронця українського слова</h3><p>Впиши прізвище та ім’я — вони з’являться на дипломі разом із твоїм реченням.</p><div class="name-fields"><div><label for="surname">Прізвище</label><input id="surname" autocomplete="family-name" maxlength="60" value="${esc(state.surname)}" oninput="saveName('surname',this.value)" placeholder="Твоє прізвище"></div><div><label for="firstName">Ім’я</label><input id="firstName" autocomplete="given-name" maxlength="60" value="${esc(state.firstName)}" oninput="saveName('firstName',this.value)" placeholder="Твоє ім’я"></div></div><h3>Створи власну сторінку книги</h3><p class="muted">Обери слово й напиши з ним своє речення.</p><div class="tray" style="justify-content:flex-start">${['мрія','сонечко','мова'].map(w=>`<button class="small ${state.word===w?'gold':'ghost'}" onclick="setWord('${w}')">${w}</button>`).join('')}</div><label for="creativeText">Моє речення зі словом «${state.word}»</label><textarea id="creativeText" maxlength="500" placeholder="Напиши тут своє речення…" oninput="saveCreative(this.value)">${esc(state.creative)}</textarea><div class="checks" id="creativeChecks"></div><label class="self-check"><input type="checkbox" id="selfCheck" ${state.selfChecked?'checked':''} onchange="state.selfChecked=this.checked;save()"><span>Я перечитав / перечитала речення та перевірив / перевірила сумнівні букви.</span></label><p class="tiny muted">Літерка перевіряє лише велику літеру, кінцевий знак і вибране слово. Зміст та правопис обговори з учителем або дорослим.</p><div class="actions"><button class="gold" onclick="printStory()">Надрукувати диплом / зберегти PDF</button></div></div><div class="actions"><button class="primary" onclick="showProgress()">Мій детальний прогрес</button><button class="ghost" onclick="showMap()">Повернутися до мапи</button><button class="ghost small" onclick="confirmRestart()">Пройти ще раз</button></div></section>`);updateCreativeChecks();celebrate();sound();}
function setWord(w){state.word=w;save();showFinish();}
function saveCreative(v){state.creative=v;state.selfChecked=false;const cb=document.getElementById('selfCheck');if(cb)cb.checked=false;save();updateCreativeChecks();}
function creativeStatus(){const s=state.creative.trim();return [/^[А-ЯІЇЄҐ]/u.test(s),/[.!?]$/.test(s),s.toLocaleLowerCase('uk-UA').split(/[^а-яіїєґ’']/u).includes(state.word)];}
function updateCreativeChecks(){const status=creativeStatus();document.getElementById('creativeChecks').innerHTML=['Велика літера','Знак у кінці',`Слово «${state.word}»`].map((s,i)=>`<span class="check ${status[i]?'yes':''}">${status[i]?'✓':'○'} ${s}</span>`).join('');}
function saveName(field,value){if(field==='surname'||field==='firstName'){state[field]=value.slice(0,60);save();}}
function printStory(){if(!state.finished)return;if(!state.surname.trim()||!state.firstName.trim()){sayToast('Впиши своє прізвище та ім’я для диплома.');document.getElementById(!state.surname.trim()?'surname':'firstName').focus();return;}if(!creativeStatus().every(Boolean)||!state.selfChecked){sayToast('Перевір три позначки та перечитай своє речення.');return;}document.getElementById('printPage').innerHTML=`<div class="diploma-inner"><div class="diploma-top">${art('owl')}<div><p class="diploma-kicker">КНИГА УКРАЇНСЬКОГО СЛОВА</p><h1>ДИПЛОМ</h1><p>за успішне проходження квесту</p></div>${art('medal')}</div><h2>«Таємниця загубленої книги»</h2><p class="diploma-label">Вітаємо!</p><div class="diploma-name" style="font-size:${state.surname.length+state.firstName.length>50?18:26}pt">${esc(state.surname.trim())}<br>${esc(state.firstName.trim())}</div><p>Твої знання, наполегливість і любов до слова<br>допомогли повернути всі загублені сторінки.</p><h3>Охоронець українського слова</h3><div class="diploma-story"><h4>Моя власна сторінка книги</h4><p>${esc(state.creative.trim().replace(/\s+/g,' '))}</p></div><p class="diploma-score">7 із 7 сторінок відновлено · ★ ${state.score} зірочок</p><div class="diploma-friends">${art('boy')}<p>Літерка, Сергійко та Оленка<br>пишаються твоїми успіхами!<br><strong>Читай. Мрій. Бережи рідне слово.</strong></p>${art('girl')}</div></div>`;window.print();}
function openModal(title,html){lastFocus=document.activeElement;document.getElementById('modalHeading').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').hidden=false;document.body.style.overflow='hidden';document.querySelector('#modal button').focus();}
function closeModal(){document.getElementById('modal').hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function showProgress(){openModal('Твоя книга досягнень',`<div class="pill-row"><span class="pill">★ ${state.score} зірочок</span><span class="pill">${state.pages.length} / 7 сторінок</span><span class="pill">Бонусів за уважність: ${state.bonuses}</span></div><p class="tiny muted">Кожне завершене завдання дає 10 зірочок один раз. Підказки не забирають балів. «Перевірки» враховують також окремі пари й кроки завдання.</p><div class="table-wrap"><table><thead><tr><th>Завдання</th><th>Стан</th><th>Перевірки</th><th>Помилки</th><th>Підказки</th></tr></thead><tbody>${tasks.map((t,i)=>{const r=state.records[t.id];return `${i===0||tasks[i-1].ch!==t.ch?`<tr class="chapter-row"><td colspan="5">${t.ch<0?'Пролог':t.ch===7?'Фінальний квест':chapters[t.ch].title}</td></tr>`:''}<tr><td>${t.title}</td><td>${r?.done?'✓ Готово':r?.attempts?'У процесі':'Попереду'}</td><td>${r?.attempts||0}</td><td>${r?.mistakes||0}</td><td>${r?.hints||0}</td></tr>`;}).join('')}</tbody></table></div>`);}
function showHelp(){openModal('Як грати',`<ol class="info-list"><li>Пройди пролог і відкривай локації на мапі по черзі.</li><li>Спочатку прочитай розповідь, потім виконай три завдання.</li><li>Картки й літери обирай натисканням. Натисни зібрану картку, щоб повернути її.</li><li>Літерка дає підказки без втрати зірочок. За помилки можна спробувати знову.</li><li>За завдання — 10 зірочок. За кожні три завдання поспіль без помилок — ще 5.</li><li>Збери сім сторінок, пройди фінал і створи власну сторінку.</li></ol><p class="tiny muted">Прогрес зберігається в цьому браузері, якщо він дозволяє локальне збереження. У приватному режимі або після очищення даних він може зникнути. Гра працює без інтернету після завантаження HTML-файлу.</p><details class="tiny"><summary>Для дорослих: навчальні уточнення</summary><p>Матеріал укладено за наданою презентацією та планом квесту. Береста й пергамент — давні матеріали для письма, але не найперші у світі. Іван Федоров — один із майстрів раннього друкарства. У 1574 році у Львові він видав «Апостол» і «Буквар». У 1581 році в Острозькій друкарні надрукував Острозьку Біблію. Художня обкладинка старої книги є умовною ілюстрацією.</p><p>Джерела уточнення: <a href="https://irbis-nbuv.gov.ua/ulib/item/ukr0000032730" target="_blank" rel="noopener">НБУВ: Острозька Біблія</a>, <a href="https://irbis-nbuv.gov.ua/dlib/col/col0001483" target="_blank" rel="noopener">НБУВ: українські стародруки</a>.</p></details>`);}
function confirmRestart(){openModal('Почати нову пригоду?',`<p>Поточні зірочки, сторінки та речення буде скинуто. Нову пригоду можна пройти ще раз від початку.</p><div class="actions"><button class="primary" onclick="restart()">Так, почати заново</button><button class="ghost" onclick="closeModal()">Залишити прогрес</button></div>`);}
function restart(){const soundOn=state.sound;state=fresh();state.sound=soundOn;save();closeModal();openTask(0);}
document.addEventListener('keydown',e=>{const modal=document.getElementById('modal');if(modal.hidden)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const a=Array.from(modal.querySelectorAll('button,a,input,textarea,select,summary,[tabindex="0"]')).filter(el=>!el.disabled);const first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
// Decode every illustration before play. Keep all repeated <img> URLs short and typed.
const IMAGE_SOURCE={...ASSETS};
let imagesReady=false;
const imageFailures=[];
function loadingView(count,failed=[]){
 app.innerHTML=`<section class="panel" style="max-width:760px;margin:50px auto;text-align:center"><div class="eyebrow">Чарівна бібліотека</div><h2>${failed.length?'Допоможімо малюнкам з’явитися':'Готуємо ілюстровану пригоду'}</h2><p>${failed.length?'Не вдалося завантажити частину ілюстрацій. Натисни кнопку, щоб спробувати ще раз.':'Літерка перевіряє, чи всі герої та загублені сторінки готові до подорожі.'}</p><div class="bar" style="height:12px;border-radius:12px;overflow:hidden"><span style="width:${count/Object.keys(IMAGE_SOURCE).length*100}%"></span></div><p role="status" aria-live="polite">Ілюстрації: ${count} / ${Object.keys(IMAGE_SOURCE).length}</p>${failed.length?'<button class="primary" onclick="prepareIllustrations()">Спробувати ще раз</button>':''}<p class="tiny muted">Після першого завантаження малюнки готові для всіх етапів гри.</p></section>`;
}
function decodedImage(url){return new Promise((resolve,reject)=>{const im=new Image();const timer=setTimeout(()=>{im.onload=im.onerror=null;reject(new Error('image timeout'))},45000);im.onload=()=>{clearTimeout(timer);if(im.naturalWidth>0&&im.naturalHeight>0)resolve(url);else reject(new Error('empty image'))};im.onerror=()=>{clearTimeout(timer);reject(new Error('image decode'))};im.src=url;});}
async function imageURL(source){
 let blob;
 if(source.startsWith('data:')){const comma=source.indexOf(','),mime=source.slice(5,source.indexOf(';')),raw=atob(source.slice(comma+1)),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);blob=new Blob([bytes],{type:mime});}
 else{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const response=await fetch(new URL(source,document.baseURI),{signal:controller.signal,cache:'no-cache'});if(!response.ok)throw new Error('image download');blob=new Blob([await response.arrayBuffer()],{type:'image/png'});}finally{clearTimeout(timer);}}
 const url=URL.createObjectURL(blob);
 try{return await decodedImage(url)}catch(err){URL.revokeObjectURL(url);return await decodedImage(source)}
}
async function prepareIllustrations(){
 document.querySelector('.topbar').inert=true;
 const entries=Object.entries(IMAGE_SOURCE),failed=[];let count=0,cursor=0;
 loadingView(count);
 async function worker(){while(cursor<entries.length){const [key,source]=entries[cursor++];try{if(!ASSETS[key].startsWith('blob:'))ASSETS[key]=await imageURL(source);count++;}catch(err){failed.push(key);}loadingView(count);}}
 await Promise.all([worker(),worker(),worker()]);
 imageFailures.splice(0,imageFailures.length,...failed);
 if(failed.length){loadingView(count,failed);return;}
 imagesReady=true;document.querySelector('.topbar').inert=false;hydrate();goHome();
}
if(typeof ResizeObserver!=='undefined'){new ResizeObserver(entries=>{document.body.style.setProperty('--footer-height',entries[0].target.getBoundingClientRect().height+'px');}).observe(document.getElementById('projectFooter'));}
prepareIllustrations();
</script>
</body></html>
